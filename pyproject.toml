[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thuner"
version = "0.0.16"
description = "Multifeature tracking and analysis of meteorological events"
readme = "README.rst"
requires-python = ">=3.10"
keywords = ["meteorology", "tracking", "analysis", "radar", "convection", "storm"]
authors = [
    {name = "Ewan Short", email = "eshort0401@gmail.com"},
    {name = "Mark Picel", email = "mhpicel@gmail.com"},
    {name = "Bhupendra Raut", email = "braut@anl.gov"},
]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "xarray>=2024.9",
    "cartopy>=0.24",
    "typing_extensions>=4.12",
    "netcdf4>=1.7",
    "h5netcdf>=1.4",
    "requests>=2.32",
    "arm_pyart>=2",
    "cmweather",
    "opencv-python>=4.10",
    "awscli>=1.35",
    "tables>=3.10",
    "pydantic>=2.9",
    "zarr>=2.18",
    "windrose>=1.9",
    "pydot>=3.0",
    "metpy>=1.6",
    "graphviz>=0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "codecov>=2.1",
]
dev = [
    "pre-commit>=4.0",
    "black>=24.10",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbstripout>=0.8",
    "build>=1.2",
    "twine>=5.0",
]
docs = [
    "sphinx",
    "nbconvert>=7.16",
]

[project.urls]
Homepage = "https://github.com/THUNER-project/THUNER"
Issues = "https://github.com/THUNER-project/THUNER/issues"
Documentation = "https://thuner.readthedocs.io/en/latest/"

[tool.setuptools.packages.find]
where = ["."]
include = ["thuner"]
exclude = ["thuner/test"]
